<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semak Status Tempahan Tiket - JEJAK66</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">
        <i class="fa-solid fa-masks-theater" style="color:#f59e0b;"></i>
        <span>JEJAK66</span>
        <span class="logo-badge">STATUS</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link"><i class="fa-solid fa-arrow-left"></i> Laman Utama</a>
        <a href="index.html#tempah" class="nav-link">Tempah Tiket</a>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top: 40px; padding-bottom: 60px;">
    
    <!-- Header -->
    <div class="section-header">
      <span class="section-badge">Pengesahan & Muat Turun</span>
      <h1 class="section-title">Semak Status Tempahan Tiket</h1>
      <p style="color: var(--text-muted); max-width: 600px; margin: 10px auto 0;">
        Masukkan Nombor Rujukan Tempahan (cth: <strong>J66-12345</strong>) atau <strong>Nombor Telefon</strong> yang didaftarkan semasa membuat pembayaran.
      </p>
    </div>

    <!-- Search Form -->
    <div class="card" style="max-width: 650px; margin: 0 auto 40px;">
      <form id="search-form" style="display: flex; gap: 12px; flex-wrap: wrap;">
        <input type="text" id="search-input" class="form-input" placeholder="Masukkan Kod Rujukan atau No Telefon..." style="flex: 1; min-width: 250px;" required>
        <button type="submit" class="btn btn-primary" id="btn-search">
          <i class="fa-solid fa-magnifying-glass"></i> Semak Sekarang
        </button>
      </form>
    </div>

    <!-- Status Results Container -->
    <div id="results-container" style="max-width: 750px; margin: 0 auto;">
      <!-- Results will be injected here via JS -->
    </div>

  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Produksi Teater JEJAK66. Pementasan 18 November 2026.</p>
      <div style="margin-top: 10px; display: flex; justify-content: center; gap: 20px;">
        <a href="index.html">Laman Utama</a>
      </div>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const query = urlParams.get('ref') || urlParams.get('phone');
      if (query) {
        document.getElementById('search-input').value = query;
        performSearch(query);
      }

      document.getElementById('search-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const val = document.getElementById('search-input').value.trim();
        if (val) performSearch(val);
      });
    });

    async function performSearch(query) {
      const container = document.getElementById('results-container');
      const btnSearch = document.getElementById('btn-search');

      btnSearch.disabled = true;
      btnSearch.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyemak...';
      container.innerHTML = '<div style="text-align: center; color: var(--text-dim); padding: 30px;"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><p style="margin-top: 10px;">Mencari rekod tempahan anda...</p></div>';

      try {
        const res = await fetch(`/api/tickets/status/${encodeURIComponent(query)}`);
        const data = await res.json();

        if (data.success && data.tickets && data.tickets.length > 0) {
          renderResults(data.tickets);
        } else {
          container.innerHTML = `
            <div class="card" style="text-align: center; padding: 40px 20px;">
              <i class="fa-solid fa-circle-question" style="font-size: 3rem; color: var(--text-dim); margin-bottom: 16px;"></i>
              <h3 style="color: #fff; margin-bottom: 8px;">Tiada Tempahan Dijumpai</h3>
              <p style="color: var(--text-muted); font-size: 0.95rem;">
                Tiada rekod tempahan yang sepadan dengan "<strong>${escapeHtml(query)}</strong>". Sila semak semula nombor telefon atau kod rujukan anda.
              </p>
              <div style="margin-top: 20px;">
                <a href="index.html#tempah" class="btn btn-primary btn-sm">Buat Tempahan Baharu</a>
              </div>
            </div>
          `;
        }
      } catch (err) {
        console.error('Search error:', err);
        container.innerHTML = `
          <div class="card" style="text-align: center; border-color: rgba(239, 68, 68, 0.4); padding: 30px;">
            <i class="fa-solid fa-circle-exclamation" style="font-size: 2.5rem; color: var(--accent-red); margin-bottom: 12px;"></i>
            <h3 style="color: #fff;">Ralat Menyemak Rekod</h3>
            <p style="color: var(--text-muted); margin-top: 6px;">Sila pastikan pelayan sedang berfungsi dan cuba sekali lagi.</p>
          </div>
        `;
      } finally {
        btnSearch.disabled = false;
        btnSearch.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Semak Sekarang';
      }
    }

    function renderResults(tickets) {
      const container = document.getElementById('results-container');
      
      let html = '';
      tickets.forEach(ticket => {
        let badgeClass = 'badge-pending';
        let badgeIcon = 'fa-clock';
        let badgeText = 'Menunggu Pengesahan';
        let statusNotice = '';
        let actionButtons = '';

        if (ticket.status === 'APPROVED') {
          badgeClass = 'badge-approved';
          badgeIcon = 'fa-circle-check';
          badgeText = 'Disahkan & Lulus';
          statusNotice = `
            <div style="background: rgba(16, 185, 129, 0.1); border-left: 4px solid var(--accent-green); padding: 14px 16px; border-radius: 4px; margin: 16px 0;">
              <div style="font-weight: 700; color: #34d399;"><i class="fa-solid fa-check"></i> Pembayaran RM${ticket.totalPrice.toFixed(2)} Telah Disahkan!</div>
              <div style="font-size: 0.88rem; color: var(--text-muted); margin-top: 4px;">
                Tiket rasmi pementasan teater anda sedia untuk dimuat turun atau dicetak sekarang.
              </div>
            </div>
          `;
          actionButtons = `
            <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px;">
              <a href="ticket.html?id=${encodeURIComponent(ticket.id)}&type=ticket" class="btn btn-primary" style="flex: 1; min-width: 200px;">
                <i class="fa-solid fa-ticket"></i> Buka & Cetak E-Tiket
              </a>
              <a href="ticket.html?id=${encodeURIComponent(ticket.id)}&type=invoice" class="btn btn-secondary" style="flex: 1; min-width: 180px;">
                <i class="fa-solid fa-file-invoice"></i> Lihat Invois Rasmi
              </a>
            </div>
          `;
        } else if (ticket.status === 'REJECTED') {
          badgeClass = 'badge-rejected';
          badgeIcon = 'fa-circle-xmark';
          badgeText = 'Ditolak';
          statusNotice = `
            <div style="background: rgba(239, 68, 68, 0.1); border-left: 4px solid var(--accent-red); padding: 14px 16px; border-radius: 4px; margin: 16px 0;">
              <div style="font-weight: 700; color: #f87171;"><i class="fa-solid fa-circle-exclamation"></i> Pembayaran Tidak Dapat Disahkan</div>
              <div style="font-size: 0.88rem; color: var(--text-muted); margin-top: 4px;">
                ${ticket.adminNote ? `Sebab: <em>${escapeHtml(ticket.adminNote)}</em>` : 'Bukti bayaran tidak lengkap atau transaksi tidak dapat disahkan. Sila buat tempahan semula atau hubungi pihak pengurusan.'}
              </div>
            </div>
          `;
          actionButtons = `
            <div style="margin-top: 14px;">
              <a href="index.html#tempah" class="btn btn-primary btn-sm">
                <i class="fa-solid fa-rotate-right"></i> Buat Tempahan Semula
              </a>
            </div>
          `;
        } else {
          // PENDING
          statusNotice = `
            <div style="background: rgba(245, 158, 11, 0.1); border-left: 4px solid var(--gold-primary); padding: 14px 16px; border-radius: 4px; margin: 16px 0;">
              <div style="font-weight: 700; color: var(--gold-hover);"><i class="fa-solid fa-hourglass-half"></i> Sedang Disemak Oleh Penganjur</div>
              <div style="font-size: 0.88rem; color: var(--text-muted); margin-top: 4px;">
                Pihak admin sedang mengesahkan bukti bayaran RM${ticket.totalPrice.toFixed(2)} anda. E-Tiket akan aktif sebaik sahaja disahkan. Sila semak semula halaman ini sebentar lagi.
              </div>
            </div>
          `;
        }

        const dateStr = new Date(ticket.createdAt).toLocaleDateString('ms-MY', {
          year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        html += `
          <div class="card" style="margin-bottom: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 14px;">
              <div>
                <span style="font-size: 0.78rem; text-transform: uppercase; color: var(--text-dim); letter-spacing: 1px;">KOD RUJUKAN</span>
                <div style="font-size: 1.4rem; font-weight: 800; color: var(--gold-text); font-family: 'Cinzel', serif;">${ticket.refCode}</div>
              </div>
              <div>
                <span class="badge ${badgeClass}">
                  <i class="fa-solid ${badgeIcon}"></i> ${badgeText}
                </span>
              </div>
            </div>

            <!-- Booking details summary -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin: 16px 0;">
              <div>
                <div style="font-size: 0.8rem; color: var(--text-dim);">Penonton:</div>
                <div style="font-weight: 600; color: #fff;">${escapeHtml(ticket.customerName)}</div>
              </div>
              <div>
                <div style="font-size: 0.8rem; color: var(--text-dim);">No. Telefon:</div>
                <div style="font-weight: 600; color: #fff;">${escapeHtml(ticket.customerPhone)}</div>
              </div>
              <div>
                <div style="font-size: 0.8rem; color: var(--text-dim);">Kuantiti Tiket:</div>
                <div style="font-weight: 700; color: var(--gold-text);">${ticket.quantity} Tiket</div>
              </div>
              <div>
                <div style="font-size: 0.8rem; color: var(--text-dim);">Jumlah Bayaran:</div>
                <div style="font-weight: 800; color: #fff;">RM ${ticket.totalPrice.toFixed(2)}</div>
              </div>
              <div>
                <div style="font-size: 0.8rem; color: var(--text-dim);">Tarikh Dihantar:</div>
                <div style="font-size: 0.85rem; color: var(--text-muted);">${dateStr}</div>
              </div>
            </div>

            ${statusNotice}
            ${actionButtons}
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
